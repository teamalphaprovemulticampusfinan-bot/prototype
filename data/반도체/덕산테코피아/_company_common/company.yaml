notes: |
  - 반도체 중심 분석용으로 keywords / core_keywords / products / tech_keywords를 축소 조정
  - 공식 홈페이지 기준으로 IR, 반도체 소재 사업, 미디어 페이지를 반영
  - 사업보고서는 홈페이지 IR > Disclosure Information 또는 DART 검색 결과에서 최신 공시 원문으로 확인 권장.
  - KIPRIS는 기업별 고정 딥링크보다 공식 검색 진입 링크를 넣는 방식이 좋아 보임.
  - 공식 브로셔 PDF는 바로 확인되지 않아 비워두었고, business_pages를 브로셔 대체 출처로 사용 가능.
  - 필요하면 extra_urls.news에 최근 반도체 소재 관련 기사 3~5건을 추가해 검색 품질을 더 높일 수 있음.
